name: Refresh podcast & newsletter

on:
  schedule:
    - cron: "17 6 * * 1"     # every Monday, 06:17 UTC
  workflow_dispatch:          # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate the content block
        run: python3 update_content.py index.html

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to update"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html content.json
          git commit -m "Refresh latest episodes and newsletter issues"
          git push
